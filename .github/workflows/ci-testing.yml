name: ci-testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  style-check:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install requirements
          run: |
            python -m pip install --upgrade pip
            pip install ruff

        - name: Run the linter
          run: ruff check

        - name: Run the format checker
          run: ruff format --check

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[aiidalab,test]"

      - name: Run the test suite with coverage
        if: contains(matrix.python-version, '3.12')
        run: pytest --cov=aiida_mcp --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Run the test suite without coverage
        if: ${{ !contains(matrix.python-version, '3.12') }}
        run: pytest

      - name: Upload coverage report
        if: contains(matrix.python-version, '3.12')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
