[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-mcp"
version = "0.1.0"
description = "MCP server for ALC's AiiDA projects"
authors = [
    { name = "Dr. Benjamin T. Speake", email = "benjamin.speake@stfc.ac.uk" },
    { name = "Joseph Thacker", email = "joseph.thacker@stfc.ac.uk" },
]
keywords = ["aiida", "workflows", "mcp"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dlpoly = ["aiida-dlpoly"]
chemshell = ["aiida-chemshell"]
mlip = ["aiida-mlip"]
aiidalab = ["jupyter-server"]
test = ["pytest"]

[project.scripts]
aiida-mcp = "aiida_mcp.server:main"


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# exclude = ["conf.py"]

[tool.ruff.lint]
select = [
    # flake8-bugbear
    "B",
    # pylint
    "C",
    "R",
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    "FA",
    # isort
    "I",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
